runtime: nodejs22
instance_class: F1
service: frontend

handlers:
  # 1. Updated static assets handler to include jpeg, gif, and web fonts
  - url: /(.*\.(json|ico|js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|txt|xml))$
    static_files: dist/\1
    upload: dist/.*\.(json|ico|js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|txt|xml)$

  # 2. React Router Catch-all fallback
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
